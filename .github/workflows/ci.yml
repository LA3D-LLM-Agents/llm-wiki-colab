name: ci

on:
  push:
    branches: [src]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history: the verify step rebuilds main from the source commit it
      # records, which is never the commit being tested.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/determinate-nix-action@v3.22.3
        with:
          extra-conf: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.2.1

      # bash 3.2 is built from source and no binary cache has it, so the
      # closure round-trips through the Actions cache keyed on the lock.
      - name: Restore the floor interpreter closure
        uses: actions/cache@v4
        with:
          path: ~/.cache/llm-wiki-floor
          key: floor-nar-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock') }}

      - name: Import the cached closure into the store
        run: |
          if [ -f ~/.cache/llm-wiki-floor/closure.nar ]; then
            nix-store --import < ~/.cache/llm-wiki-floor/closure.nar
          fi

      - name: Build the shell and run the test tasks
        run: devenv test

      # main is published locally, where the harness CLIs live. CI's part is
      # to prove the published tree rebuilds from the source commit it names,
      # and on a release tag, that the tag names that commit and its version.
      - name: Verify main reproduces from its recorded source commit
        shell: devenv shell -- bash -e {0}
        run: |
          args=(--verify origin/main --reachable-from origin/src)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          uv run build/publish.py "${args[@]}"

      - name: Export the floor interpreter closure for the cache
        shell: devenv shell -- bash -e {0}
        run: |
          set -o pipefail
          mkdir -p ~/.cache/llm-wiki-floor
          nix-store --query --requisites "$LLM_WIKI_BASH32" \
            | xargs nix-store --export > ~/.cache/llm-wiki-floor/closure.nar
