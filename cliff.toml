# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# Release notes for the people who install the plugin, generated from the
# conventional commits on src between two release tags. Commits scoped to the
# repository's own tooling never reach them; the scope is what separates a fix
# in a shipped hook from a fix in CI, since the type alone cannot.

[remote.github]
owner = "LA3D-LLM-Agents"
repo = "llm-wiki-colab"

[changelog]
header_marker = "<!-- git-cliff: end of header -->"
# One heading per release, one group per change type, one entry per commit.
# The entry carries the subject and the first sentence of the body, since the
# body is where a commit says what a user would have seen.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}`{{ commit.scope }}`: {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.body %}
  {{ commit.body | split(pat="\n") | first | trim }}\
{% endif %}
{% endfor %}\
{% endfor %}\
{% if version and previous.version %}

[{{ version | trim_start_matches(pat="v") }}]: https://github.com/LA3D-LLM-Agents/llm-wiki-colab/compare/{{ previous.version }}..{{ version }}
{% endif %}\
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# Order matters: the first matching parser wins, so the internal scopes are
# skipped before the type parsers can claim them.
commit_parsers = [
    { message = "^[a-z]+\\((ci|dev|docs|build|deps|act|tests?|publish|release|harness|scripts)\\)", skip = true },
    { message = "^(chore|docs|test|style)\\b", skip = true },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^(refactor|perf)", group = "<!-- 2 -->Changed" },
    { message = "^revert", group = "<!-- 3 -->Reverted" },
]
filter_commits = true
# Tags name releases and nothing else.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
